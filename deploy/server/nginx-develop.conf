# develop.vibelabsmc.org: the vibelabsmc-website app (develop branch), Bun on 127.0.0.1:3040.
# Reached through Cloudflare's proxy; the origin certificate is a Cloudflare Origin CA cert.
# The app sets its own security headers (CSP with nonces, HSTS, noindex); nginx adds them only
# where it serves files itself (downloads and images).

limit_req_zone $binary_remote_addr zone=vibelabs_web_auth:10m rate=30r/m;

upstream vibelabs_web {
    server 127.0.0.1:3040;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name develop.vibelabsmc.org;
    return 301 https://develop.vibelabsmc.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name develop.vibelabsmc.org;

    ssl_certificate     /etc/ssl/vibelabs/develop.vibelabsmc.org.crt;
    ssl_certificate_key /etc/ssl/vibelabs/develop.vibelabsmc.org.key;

    access_log /var/log/nginx/develop.vibelabsmc.org.access.log;
    error_log  /var/log/nginx/develop.vibelabsmc.org.error.log;

    # The visitor's real address comes from Cloudflare, and is trusted only from Cloudflare.
    include /etc/nginx/snippets/vibelabs-cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://vibelabs_web;
    }

    # Sign-in pages: a second rate limit in front of the app's own.
    location ~ ^/(login|signup|forgot-password|reset-password|auth/) {
        limit_req zone=vibelabs_web_auth burst=30 nodelay;
        proxy_pass http://vibelabs_web;
    }

    # Project files: up to 100 MB, streamed straight through to the app.
    location ~ ^/api/projects/[^/]+/uploads$ {
        client_max_body_size 105m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://vibelabs_web;
    }

    # Downloads: the app checks access and counts, then hands the file over here.
    location /__files/ {
        internal;
        alias /var/lib/vibelabs-web/files/;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "private, no-store" always;
    }

    # Re-encoded images, named by content hash: served from disk, cached for a year.
    # (Quoted: a regex with braces must be, in nginx.)
    location ~ "^/media/(([0-9a-f]{2})[0-9a-f]{62}(\.thumb)?\.webp)$" {
        alias /var/lib/vibelabs-web/images/$2/$1;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }
}
